// CSVパース共通ヘルパー
function parseCSVData(csvText) {
    const rows = csvText.split(/\r?\n/);
    const loadedWords = [];
    for (let i = 1; i < rows.length; i++) {
        if (!rows[i].trim()) continue;
        const cols = rows[i].split(",");
        if (cols.length >= 2) {
            const kanjiVal = cols[0].replace(/^"|"$/g, '').trim();
            const kanaVal = cols[1].replace(/^"|"$/g, '').trim();
            if (kanjiVal && kanaVal) {
                loadedWords.push({ kanji: kanjiVal, kana: kanaVal });
            }
        }
    }
    return loadedWords;
}

// データ読み込み処理
async function loadAllWordLists() {
    // 1. 表モードお題読み込み
    try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        if (!response.ok) throw new Error();
        const data = await response.text();
        normalWordList = parseCSVData(data);
    } catch (e) {
        console.warn("表モードデータの読み込み失敗。予備データを使用します。");
        normalWordList = fallbackWordList;
    }

    // 2. 裏モード（鬼武者）お題読み込み
    if (ONIMUSHA_SPREADSHEET_CSV_URL) {
        try {
            const responseOni = await fetch(ONIMUSHA_SPREADSHEET_CSV_URL);
            if (!responseOni.ok) throw new Error();
            const dataOni = await responseOni.text();
            onimushaWordList = parseCSVData(dataOni);
        } catch (e) {
            console.warn("裏モードデータの読み込み失敗。予備データを使用します。");
            onimushaWordList = fallbackOnimushaWordList;
        }
    } else {
        onimushaWordList = fallbackOnimushaWordList;
    }

    // ボタン有効化
    document.getElementById("btn-assist").disabled = false;
    document.getElementById("btn-no-assist").disabled = false;
}

            document.getElementById("highscore-assist").innerText = `👑 最速: ${bestTimes.assist.toFixed(2)} 秒`;
        } else {
            document.getElementById("highscore-assist").innerText = `👑 最速: -- 秒`;
        }

        if (savedNoAssist) {
            bestTimes['no-assist'] = parseFloat(savedNoAssist);
            document.getElementById("highscore-no-assist").innerText = `👑 最速: -- 秒`;
        } else {
            document.getElementById("highscore-no-assist").innerText = `👑 最速: -- 秒`;
        }
    } catch(e) {
        console.error("ローカルストレージの読み込みエラー:", e);
    }
}

loadAllHighScores();
loadAllWordLists();

function prepareQuestions() {
    const activeList = isOnimushaMode ? onimushaWordList : normalWordList;
    const shuffled = [...activeList];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    questionPool = shuffled.slice(0, TOTAL_QUESTIONS);
}

function startGame(mode) {
    currentMode = mode;
    prepareQuestions();
    
    const badge = document.getElementById("difficulty-badge");

    if (mode === 'assist') {
        badge.innerText = isOnimushaMode ? "鬼武者：アシストあり" : "アシストありモード";
        badge.style.backgroundColor = "#4caf50";
    } else {
        badge.innerText = isOnimushaMode ? "鬼武者：アシストなし" : "アシストなしモード";
        badge.style.backgroundColor = "#ff5722";
    }

    document.getElementById("start-screen").style.display = "none";
    document.getElementById("result-area").style.display = "none";
    document.getElementById("new-record-text").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    document.getElementById("btn-mode-toggle").style.display = "none";
    
    questionCount = 0;
    document.getElementById("progress").innerText = questionCount;
    document.getElementById("utsuro-img").src = "utsuro_normal.png";
    
    // モードに応じてBGMの音量を調整（表モード: 0.2 / 裏モード: 0.1）
    bgm.volume = isOnimushaMode ? 0.1 : 0.2;
    bgm.currentTime = 0; 
    bgm.play().catch(err => {
        console.log("BGMの再生に失敗しました");
    });

    isPlaying = true;
    isAnimating = false;
    
    startTime = Date.now();
    timerInterval = setInterval(() => {
        elapsedTime = (Date.now() - startTime) / 1000;
        document.getElementById("timer").innerText = elapsedTime.toFixed(2);
    }, 50);

    nextWord();
}

function retireGame() {
    if (confirm("タイトル画面に戻りますか？")) {
        clearInterval(timerInterval);
        isPlaying = false;
        bgm.pause();
        
        document.getElementById("game-screen").style.display = "none";
        document.getElementById("start-screen").style.display = "block";
        document.getElementById("btn-mode-toggle").style.display = "block";
    }
}

function applyHepburnMacron(kana) {
    let noBar = kana.replace(/ー/g, "");
    let result = "";
    let i = 0;
    while (i < noBar.length) {
        let char = noBar[i];
        let next = noBar[i + 1];
        
        if (char === "ん") {
            if (!next || !["あ","い","う","え","お","や","ゆ","よ","ぁ","ぃ","ぅ","ぇ","ぉ","ゃ","ゅ","ょ"].includes(next)) {
                result += char; 
                i++;
                continue; 
            }
        }
        
        if ((char === "お" || char === "こ" || char === "そ" || char === "と" || char === "の" || char === "ほ" || char === "も" || char === "よ" || char === "ろ" || char === "ご" || char === "ぞ" || char === "ど" || char === "ぼ" || char === "ぽ" || char === "きょ" || char === "しょ" || char === "ちょ" || char === "にょ" || char === "ひょ" || char === "みょ" || char === "りょ" || char === "ぎょ" || char === "じょ" || char === "びゃ" || char === "ぴゃ") && (next === "う" || next === "お")) {
            result += char;
            i += 2;
        } else if (i + 2 <= noBar.length && ["きょ", "しゃ", "しゅ", "しょ", "ちゃ", "ちゅ", "ちょ", "にゃ", "にゅ", "にょ", "ひゃ", "ひゅ", "ひょ", "みゃ", "みゅ", "みょ", "りゃ", "りゅ", "りょ", "ぎゃ", "ぎゅ", "ぎょ", "じゃ", "じゅ", "じょ", "びゃ", "びゅ", "びょ", "ぴゃ", "ぴゅ", "ぴょ"].includes(noBar.substring(i, i+2))) {
            let doubleChar = noBar.substring(i, i+2);
            let nextNext = noBar[i + 2];
            if (nextNext === "う" || nextNext === "お") {
                result += doubleChar;
                i += 3;
            } else {
                result += doubleChar;
                i += 2;
            }
        } else {
            result += char;
            i++;
        }
    }
    return result;
}

function nextWord() {
    if (questionPool.length === 0) {
        endGame();
        return;
    }
    
    currentWord = questionPool.pop();
    questionCount++;
    document.getElementById("progress").innerText = questionCount;
    
    remainingKana = applyHepburnMacron(currentWord.kana);
    typedRoma = "";
    
    document.getElementById("kanji-display").innerText = currentWord.kana;
    document.getElementById("kana-display").innerText = currentWord.kanji; 
    
    parseNextRoma();
    displayRoma = makeDefaultRoma(remainingKana);
    updateDisplay();
}

function parseNextRoma() {
    if (remainingKana.length === 0) {
        currentRomaOptions = [];
        return;
    }
    if (remainingKana.startsWith("っ") && remainingKana.length > 1) {
        const nextChar = remainingKana.charAt(1);
        const nextRomaList = romanMap[nextChar] || [nextChar.toLowerCase()];
        currentRomaOptions = [...romanMap['っ'], ...nextRomaList.map(r => r.charAt(0))];
        return;
    }
    
    if (remainingKana.length >= 3) {
        const tripleChar = remainingKana.substring(0, 3);
        if (romanMap[tripleChar]) {
            currentRomaOptions = romanMap[tripleChar];
            return;
        }
    }
    
    if (remainingKana.length >= 2) {
        const doubleChar = remainingKana.substring(0, 2);
        if (romanMap[doubleChar]) {
            currentRomaOptions = romanMap[doubleChar];
            return;
        }
    }
    const singleChar = remainingKana.substring(0, 1);
    currentRomaOptions = romanMap[singleChar] || [singleChar.toLowerCase()];
}

function makeDefaultRoma(kana) {
    let res = "";
    let i = 0;
    while (i < kana.length) {
        if (kana[i] === "っ" && i + 1 < kana.length) {
            let next = romanMap[kana[i+1]];
            res += next ? next[0].charAt(0) : "x";
            i++;
            continue;
        }
        if (i + 2 < kana.length && romanMap[kana.substring(i, i+3)]) {
            res += romanMap[kana.substring(i, i+3)][0];
            i += 3;
        } else if (i + 1 < kana.length && romanMap[kana.substring(i, i+2)]) {
            res += romanMap[kana.substring(i, i+2)][0];
            i += 2;
        } else {
            res += (romanMap[kana[i]] ? romanMap[kana[i]][0] : kana[i].toLowerCase());
            i++;
        }
    }
    return res;
}

function updateDisplay() {
    const kanaDisplay = document.getElementById("kana-display");
    let html = "";

    if (currentMode === 'assist' || isAnimating) {
        html = `<span class="typed">${typedRoma}</span><span class="untyped">${displayRoma.substring(typedRoma.length)}</span>`;
        kanaDisplay.style.display = "block";
        
        if (isAnimating && currentMode === 'no-assist') {
            kanaDisplay.style.color = isOnimushaMode ? "#ff5252" : "#1a237e";
            kanaDisplay.style.opacity = "1.0";
        } else {
            kanaDisplay.style.color = "#888888";
            kanaDisplay.style.opacity = "0.3";
        }
    } else {
        const typedMask = "●".repeat(typedRoma.length);
        const untypedMask = "●".repeat(displayRoma.length - typedRoma.length);
        html = `<span class="typed">${typedMask}</span><span class="untyped">${untypedMask}</span>`;
        kanaDisplay.style.display = "none";
    }
    document.getElementById("typing-display").innerHTML = html;
}

window.addEventListener("keydown", (e) => {
    if (!isPlaying || isAnimating) return;
    if (e.key.length !== 1) return;
    
    const pressed = e.key.toLowerCase();
    let matchedOptions = currentRomaOptions.filter(opt => opt.startsWith(pressed));
    
    if (matchedOptions.length > 0) {
        typedRoma += pressed;
        
        if (remainingKana.startsWith("っ") && remainingKana.length > 1 && !romanMap['っ'].includes(pressed + currentRomaOptions.find(opt => opt.startsWith(pressed)).substring(1))) {
            remainingKana = remainingKana.substring(1);
            displayRoma = typedRoma + makeDefaultRoma(remainingKana);
            parseNextRoma();
            updateDisplay();
            return;
        }

        currentRomaOptions = matchedOptions.map(opt => opt.substring(1)).filter(opt => opt.length > 0);
            
        if (currentRomaOptions.length === 0) {
            if (remainingKana.length >= 3 && romanMap[remainingKana.substring(0, 3)]) {
                remainingKana = remainingKana.substring(3);
            } else if (remainingKana.length >= 2 && romanMap[remainingKana.substring(0, 2)]) {
                remainingKana = remainingKana.substring(2);
            } else {
                remainingKana = remainingKana.substring(1);
            }
            displayRoma = typedRoma + makeDefaultRoma(remainingKana);
            parseNextRoma();
        } else {
            let longestNextPredict = currentRomaOptions[0]; 
            let skipCount = 1;
            if (remainingKana.length >= 3 && romanMap[remainingKana.substring(0, 3)]) skipCount = 3;
            else if (remainingKana.length >= 2 && romanMap[remainingKana.substring(0, 2)]) skipCount = 2;
            
            displayRoma = typedRoma + longestNextPredict + makeDefaultRoma(remainingKana.substring(skipCount));
        }
        
        updateDisplay();
        
        if (remainingKana.length === 0 && currentRomaOptions.length === 0) {
            isAnimating = true;
            if (!isOnimushaMode) {
                document.getElementById("utsuro-img").src = "utsuro_clear.png";
            }
            
            updateDisplay();
            
            setTimeout(() => {
                if (!isOnimushaMode) {
                    document.getElementById("utsuro-img").src = "utsuro_normal.png";
                }
                isAnimating = false;
                nextWord();
            }, 250);
        }
    }
});

function endGame() {
    clearInterval(timerInterval);
    isPlaying = false;
    bgm.pause();
    
    const finalTime = elapsedTime.toFixed(2);
    const modeName = currentMode === 'assist' ? "アシストあり" : "アシストなし";
    const prefix = isOnimushaMode ? "oni_" : "utsuro_";
    const storageKey = `${prefix}typing_genma_best_${currentMode === 'assist' ? 'assist' : 'noassist'}`;
    const pastBest = bestTimes[currentMode];

    document.getElementById("start-screen").style.display = "block";
    document.getElementById("game-screen").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    document.getElementById("btn-mode-toggle").style.display = "block";
    
    document.getElementById("final-score-text").innerText = `クリアタイム（${modeName}）: ${finalTime} 秒`;
    
    if (pastBest === null || parseFloat(finalTime) < pastBest) {
        bestTimes[currentMode] = parseFloat(finalTime);
        localStorage.setItem(storageKey, bestTimes[currentMode]);
        document.getElementById("new-record-text").style.display = "block";
    } else {
        document.getElementById("new-record-text").style.display = "none";
    }
    
    loadAllHighScores();
    
    setTimeout(() => {
        alert(`10問クリア！タイムは ${finalTime} 秒でした！`);
    }, 100);
}

function shareOnX() {
    const finalTime = elapsedTime.toFixed(2);
    const modeName = currentMode === 'assist' ? "アシストあり" : "アシストなし";
    const gameUrl = window.location.href;
    
    let text = "";
    let hashtags = "";

    if (isOnimushaMode) {
        // 裏モード：氷室うつろの名前を出さず、ハッシュタグは鬼武者と幻魔文字
        text = `鬼武者タイピングゲーム（幻魔文字・裏モード【${modeName}】）をクリア！\nタイム: 【 ${finalTime} 秒 】\n幻魔文字の解読速度に挑戦しよう！\n`;
        hashtags = "鬼武者,幻魔文字";
    } else {
        // 表モード：従来の表示
        text = `氷室うつろタイピングゲーム（幻魔文字・表モード【${modeName}】）をクリア！\nタイム: 【 ${finalTime} 秒 】\n幻魔文字の解読速度に挑戦しよう！\n`;
        hashtags = "氷室うつろ,幻魔文字,鬼武者";
    }
    
    const shareUrl = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(gameUrl)}&hashtags=${encodeURIComponent(hashtags)}`;
    
    window.open(shareUrl, '_blank', 'width=600,height=400');
}
