    <style>
        /* --------------------------------------------------
           幻魔文字Webフォント定義（Genmamoji2.otf）
        -------------------------------------------------- */

            font-family: 'GenmaFont';
            src: url('Genmamoji2.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;

        /* 出題表示エリア（幻魔文字適用） */

<body>

<div id="game-container">
    <h1>氷室うつろ タイピングゲーム（幻魔文字版）</h1>
    
    <div id="start-screen">
        <div class="pc-only-banner">
            ⚠️ 物理キーボード必須<br>（スマートフォンやタブレットでも、Bluetooth接続などの外部キーボードが使用できればプレイ可能です）
        </div>

        <div id="error-message"></div>

        <p>モードを選択して全10問の最速タイムに挑戦しよう！</p>
        
        <div class="difficulty-container">
            <div>
                <button id="btn-assist" class="btn-assist" onclick="startGame('assist')" disabled>アシストあり<br><span style="font-size: 13px;">(漢字＆ローマ字表示)</span></button>
                <div id="highscore-assist" class="highscore-display">👑 最速: -- 秒</div>
            </div>
            <div>
                <button id="btn-no-assist" class="btn-no-assist" onclick="startGame('no-assist')" disabled>アシストなし<br><span style="font-size: 13px;">(解読力テスト)</span></button>
                <div id="highscore-no-assist" class="highscore-display">👑 最速: -- 秒</div>
            </div>
        </div>
        
        <p style="color: #d32f2f; font-size: 14px; font-weight: bold; margin-bottom: 15px;">⚠️ 注：ボタンを押すと音楽が流れます</p>
        
        <div id="result-area" style="display: none;">
            <p id="final-score-text" style="font-size: 20px; font-weight: bold; margin-top: 20px; color: #1a237e;"></p>
            <p id="new-record-text" style="font-size: 18px; font-weight: bold; color: #e53935; display: none; margin-top: 5px;">🎉 最速記録更新！！</p>
            <button class="btn-share" onclick="shareOnX()">𝕏 結果をポストする</button>
        </div>
    </div>

    <div id="game-screen" style="display: none;">
        <div id="difficulty-badge"></div>

        <div class="game-layout">
            <div class="image-area">
                <img id="utsuro-img" src="utsuro_normal.png" alt="氷室うつろ">
            </div>
            
            <div class="text-area">
                <!-- 出題表示（kanaから出題・CSSにより幻魔文字化） -->
                <div id="kanji-display"></div>
                <!-- 補足用（薄めの漢字表示エリア：アシストなしの時は非表示） -->
                <div id="kana-display"></div>
            </div>
        </div>
        
        <!-- ローマ字入力表示エリア（アシストなしの時は非表示） -->
        <div id="typing-display"></div>
        <div id="score-display">進捗: <span id="progress">0</span> / 10 | 経過時間: <span id="timer">0.00</span>秒</div>
        
        <!-- リタイア（タイトルへ戻る）ボタン -->
        <div>
            <button id="btn-retire" class="btn-retire" onclick="retireGame()">タイトルへ戻る</button>
        </div>
    </div>
</div>

<audio id="bgm" src="bgm.mp3" loop></audio>

<script>
const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS8LcvFteNKwd7-XOLg3aJKG1QOQGxeAvqx3ZeTrs4RMfF7PYzSQwRnhQDnSS_psFW700l36MHWreuB/pub?gid=0&single=true&output=csv";
const TOTAL_QUESTIONS = 10;

let wordList = []; 

const romanMap = {
    'あ':['a'], 'い':['i','yi'], 'う':['u','wu'], 'え':['e','ye'], 'お':['o'],
    'か':['ka'], 'き':['ki'], 'く':['ku'], 'け':['ke'], 'こ':['ko'],
    'さ':['sa'], 'し':['si','shi'], 'す':['su'], 'せ':['se'], 'そ':['so'],
    'た':['ta'], 'ち':['ti','chi'], 'つ':['tu','tsu'], 'て':['te'], 'と':['to'],
    'な':['na'], 'に':['ni'], 'ぬ':['nu'], 'ね':['ne'], 'の':['no'],
    'は':['ha'], 'ひ':['hi'], 'ふ':['fu','hu'], 'へ':['he'], 'ほ':['ho'],
    'ま':['ma'], 'み':['mi'], 'む':['mu'], 'め':['me'], 'も':['mo'],
    'や':['ya'], 'ゆ':['yu'], 'よ':['yo'],
    'ら':['ra'], 'り':['ri'], 'る':['ru'], 'れ':['re'], 'ろ':['ro'],
    'わ':['wa'], 'を':['wo'], 'ん':['n'],
    'が':['ga'], 'ぎ':['gi'], 'ぐ':['gu'], 'げ':['ge'], 'ご':['go'],
    'ざ':['za'], 'じ':['zi','ji'], 'ず':['zu'], 'ぜ':['ze'], 'ぞ':['zo'],
    'だ':['da'], 'ぢ':['di','zi','ji'], 'づ':['du','zu'], 'で':['de'], 'ど':['do'],
    'ば':['ba'], 'び':['bi'], 'ぶ':['bu'], 'べ':['be'], 'ぼ':['bo'],
    'ぱ':['pa'], 'ぴ':['pi'], 'ぷ':['pu'], 'ぺ':['pe'], 'ぽ':['po'],
    'きゃ':['kya'], 'きゅ':['kyu'], 'きょ':['kyo'],
    'しゃ':['sya','sha'], 'しゅ':['syu','shu'], 'しょ':['syo','sho'],
    'ちゃ':['tya','cha'], 'ちゅ':['tyu','chu'], 'ちょ':['tyo','cho'],
    'にゃ':['nya'], 'にゅ':['nyu'], 'にょ':['nyo'],
    'ひゃ':['hya'], 'ひゅ':['hyu'], 'ひょ':['hyo'],
    'みゃ':['mya'], 'みゅ':['myu'], 'みょ':['myo'],
    'りゃ':['rya'], 'りゅ':['ryu'], 'りょ':['ryo'],
    'ぎゃ':['gya'], 'ぎゅ':['gyu'], 'ぎょ':['gyo'],
    'じゃ':['zya','ja'], 'じゅ':['zyu','ju'], 'じょ':['zyo','jo'],
    'びゃ':['bya'], 'びゅ':['byu'], 'びょ':['byo'],
    'ぴゃ':['pya'], 'ぴゅ':['pyu'], 'ぴょ':['po'],
    'うぉ':['who','uxo'], 
    'ふぁ':['fa','fua'], 
    'しゅぉ':['syuwho','syuulo','syuuxo','shuwho','shuulo','shuuxo'],
    'ぁ':['la','xa'], 'ぃ':['li','xi'], 'ぅ':['lu','xu','xtu','ltu'], 'ぇ':['le','xe'], 
    'ぉ':['lo','xo'],
    'ゃ':['lya','xya'], 'ゅ':['lyu','xyu'], 'ょ':['lyo','xyo'], 'ゎ':['lwa','xwa'],
    'っ':['ltu','xtu','c','s','t'],
    'ー':['-'], '！':['!'], '、':[','], ' ':[' ']
};

let currentWord = {};
let remainingKana = "";
let currentRomaOptions = []; 
let displayRoma = "";        
let typedRoma = "";         
let questionCount = 0;
let startTime = 0;
let elapsedTime = 0;
let timerInterval;
let isPlaying = false;
let isAnimating = false;
let questionPool = [];

let currentMode = 'assist';
let bestTimes = { assist: null, 'no-assist': null };

const bgm = document.getElementById("bgm");

async function loadWordListFromSpreadsheet() {
    try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        if (!response.ok) throw new Error("データの取得に失敗しました");
        
        const data = await response.text();
        const rows = data.split(/\r?\n/);
        
        const loadedWords = [];
        for (let i = 1; i < rows.length; i++) {
            if (!rows[i].trim()) continue;
            
            const cols = rows[i].split(",");
            if (cols.length >= 2) {
                const kanjiVal = cols[0].replace(/^"|"$/g, '').trim();
                const kanaVal = cols[1].replace(/^"|"$/g, '').trim();
                
                if (kanjiVal && kanaVal) {
                    loadedWords.push({ kanji: kanjiVal, kana: kanaVal });
                }
            }
        }
        
        if (loadedWords.length === 0) {
            document.getElementById("error-message").innerText = "⚠️ スプレッドシートにお題データが見つかりません";
            return;
        }
        
        wordList = loadedWords;
        document.getElementById("error-message").innerText = ""; 
        document.getElementById("btn-assist").disabled = false;
        document.getElementById("btn-no-assist").disabled = false;
        
    } catch (error) {
        console.error(error);
        document.getElementById("error-message").innerText = "⚠️ お題データの読み込みに失敗しました。URLの設定を確認してください。";
    }
}

function loadAllHighScores() {
    const savedAssist = localStorage.getItem("utsuro_typing_genma_best_assist");
    const savedNoAssist = localStorage.getItem("utsuro_typing_genma_best_noassist");
    
    if (savedAssist) {
        bestTimes.assist = parseFloat(savedAssist);
        document.getElementById("highscore-assist").innerText = `👑 最速: ${bestTimes.assist.toFixed(2)} 秒`;
    } else {
        document.getElementById("highscore-assist").innerText = `👑 最速: -- 秒`;
    }

    if (savedNoAssist) {
        bestTimes['no-assist'] = parseFloat(savedNoAssist);
        document.getElementById("highscore-no-assist").innerText = `👑 最速: ${bestTimes['no-assist'].toFixed(2)} 秒`;
    } else {
        document.getElementById("highscore-no-assist").innerText = `👑 最速: -- 秒`;
    }
}

loadAllHighScores();
loadWordListFromSpreadsheet();

function prepareQuestions() {
    const shuffled = [...wordList];
    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    questionPool = shuffled.slice(0, TOTAL_QUESTIONS);
}

function startGame(mode) {
    currentMode = mode;
    prepareQuestions();
    
    const badge = document.getElementById("difficulty-badge");
    const typingDisplay = document.getElementById("typing-display");
    const kanaDisplay = document.getElementById("kana-display");

    if (mode === 'assist') {
        badge.innerText = "アシストありモード";
        badge.style.backgroundColor = "#4caf50";
        typingDisplay.style.display = "block";
        kanaDisplay.style.display = "block";
    } else {
        badge.innerText = "アシストなしモード";
        badge.style.backgroundColor = "#ff5722";
        typingDisplay.style.display = "none";
        kanaDisplay.style.display = "none";
    }

    document.getElementById("start-screen").style.display = "none";
    document.getElementById("result-area").style.display = "none";
    document.getElementById("new-record-text").style.display = "none";
    document.getElementById("game-screen").style.display = "block";
    
    questionCount = 0;
    document.getElementById("progress").innerText = questionCount;
    document.getElementById("utsuro-img").src = "utsuro_normal.png";
    
    bgm.volume = 0.2;
    bgm.currentTime = 0; 
    bgm.play().catch(err => {
        console.log("BGMの再生に失敗しました");
    });

    isPlaying = true;
    isAnimating = false;
    
    startTime = Date.now();
    timerInterval = setInterval(() => {
        elapsedTime = (Date.now() - startTime) / 1000;
        document.getElementById("timer").innerText = elapsedTime.toFixed(2);
    }, 50);

    nextWord();
}

function retireGame() {
    if (confirm("タイトル画面に戻りますか？")) {
        clearInterval(timerInterval);
        isPlaying = false;
        bgm.pause();
        
        document.getElementById("game-screen").style.display = "none";
        document.getElementById("start-screen").style.display = "block";
    }
}

function applyHepburnMacron(kana) {
    let noBar = kana.replace(/ー/g, "");
    let result = "";
    let i = 0;
    while (i < noBar.length) {
        let char = noBar[i];
        let next = noBar[i + 1];
        
        if (char === "ん") {
            if (!next || !["あ","い","う","え","お","や","ゆ","よ","ぁ","ぃ","ぅ","ぇ","ぉ","ゃ","ゅ","ょ"].includes(next)) {
                result += char; 
                i++;
                continue; 
            }
        }
        
        if ((char === "お" || char === "こ" || char === "そ" || char === "と" || char === "の" || char === "ほ" || char === "も" || char === "よ" || char === "ろ" || char === "ご" || char === "ぞ" || char === "ど" || char === "ぼ" || char === "ぽ" || char === "きょ" || char === "しょ" || char === "ちょ" || char === "にょ" || char === "ひょ" || char === "みょ" || char === "りょ" || char === "ぎょ" || char === "じょ" || char === "びゃ" || char === "ぴゃ") && (next === "う" || next === "お")) {
            result += char;
            i += 2;
        } else if (i + 2 <= noBar.length && ["きょ", "しゃ", "しゅ", "しょ", "ちゃ", "ちゅ", "ちょ", "にゃ", "にゅ", "にょ", "ひゃ", "ひゅ", "ひょ", "みゃ", "みゅ", "みょ", "りゃ", "りゅ", "りょ", "ぎゃ", "ぎゅ", "ぎょ", "じゃ", "じゅ", "じょ", "びゃ", "びゅ", "びょ", "ぴゃ", "ぴゅ", "ぴょ"].includes(noBar.substring(i, i+2))) {
            let doubleChar = noBar.substring(i, i+2);
            let nextNext = noBar[i + 2];
            if (nextNext === "う" || nextNext === "お") {
                result += doubleChar;
                i += 3;
            } else {
                result += doubleChar;
                i += 2;
            }
        } else {
            result += char;
            i++;
        }
    }
    return result;
}

function nextWord() {
    if (questionPool.length === 0) {
        endGame();
        return;
    }
    
    currentWord = questionPool.pop();
    questionCount++;
    document.getElementById("progress").innerText = questionCount;
    
    remainingKana = applyHepburnMacron(currentWord.kana);
    typedRoma = "";
    
    document.getElementById("kanji-display").innerText = currentWord.kana;
    document.getElementById("kana-display").innerText = currentWord.kanji; 
    
    parseNextRoma();
    displayRoma = makeDefaultRoma(remainingKana);
    updateDisplay();
}

function parseNextRoma() {
    if (remainingKana.length === 0) {
        currentRomaOptions = [];
        return;
    }
    if (remainingKana.startsWith("っ") && remainingKana.length > 1) {
        const nextChar = remainingKana.charAt(1);
        const nextRomaList = romanMap[nextChar] || [nextChar.toLowerCase()];
        currentRomaOptions = [...romanMap['っ'], ...nextRomaList.map(r => r.charAt(0))];
        return;
    }
    
    if (remainingKana.length >= 3) {
        const tripleChar = remainingKana.substring(0, 3);
        if (romanMap[tripleChar]) {
            currentRomaOptions = romanMap[tripleChar];
            return;
        }
    }
    
    if (remainingKana.length >= 2) {
        const doubleChar = remainingKana.substring(0, 2);
        if (romanMap[doubleChar]) {
            currentRomaOptions = romanMap[doubleChar];
            return;
        }
    }
    const singleChar = remainingKana.substring(0, 1);
    currentRomaOptions = romanMap[singleChar] || [singleChar.toLowerCase()];
}

function makeDefaultRoma(kana) {
    let res = "";
    let i = 0;
    while (i < kana.length) {
        if (kana[i] === "っ" && i + 1 < kana.length) {
            let next = romanMap[kana[i+1]];
            res += next ? next[0].charAt(0) : "x";
            i++;
            continue;
        }
        if (i + 2 < kana.length && romanMap[kana.substring(i, i+3)]) {
            res += romanMap[kana.substring(i, i+3)][0];
            i += 3;
        } else if (i + 1 < kana.length && romanMap[kana.substring(i, i+2)]) {
            res += romanMap[kana.substring(i, i+2)][0];
            i += 2;
        } else {
            res += (romanMap[kana[i]] ? romanMap[kana[i]][0] : kana[i].toLowerCase());
            i++;
        }
    }
    return res;
}

function updateDisplay() {
    let html = `<span class="typed">${typedRoma}</span><span class="untyped">${displayRoma.substring(typedRoma.length)}</span>`;
    document.getElementById("typing-display").innerHTML = html;
}

window.addEventListener("keydown", (e) => {
    if (!isPlaying || isAnimating) return;
    if (e.key.length !== 1) return;
    
    const pressed = e.key.toLowerCase();
    let matchedOptions = currentRomaOptions.filter(opt => opt.startsWith(pressed));
    
    if (matchedOptions.length > 0) {
        typedRoma += pressed;
        
        if (remainingKana.startsWith("っ") && remainingKana.length > 1 && !romanMap['っ'].includes(pressed + currentRomaOptions.find(opt => opt.startsWith(pressed)).substring(1))) {
            remainingKana = remainingKana.substring(1);
            displayRoma = typedRoma + makeDefaultRoma(remainingKana);
            parseNextRoma();
            updateDisplay();
            return;
        }

        currentRomaOptions = matchedOptions.map(opt => opt.substring(1)).filter(opt => opt.length > 0);
            
        if (currentRomaOptions.length === 0) {
            if (remainingKana.length >= 3 && romanMap[remainingKana.substring(0, 3)]) {
                remainingKana = remainingKana.substring(3);
            } else if (remainingKana.length >= 2 && romanMap[remainingKana.substring(0, 2)]) {
                remainingKana = remainingKana.substring(2);
            } else {
                remainingKana = remainingKana.substring(1);
            }
            displayRoma = typedRoma + makeDefaultRoma(remainingKana);
            parseNextRoma();
        } else {
            let longestNextPredict = currentRomaOptions[0]; 
            let skipCount = 1;
            if (remainingKana.length >= 3 && romanMap[remainingKana.substring(0, 3)]) skipCount = 3;
            else if (remainingKana.length >= 2 && romanMap[remainingKana.substring(0, 2)]) skipCount = 2;
            
            displayRoma = typedRoma + longestNextPredict + makeDefaultRoma(remainingKana.substring(skipCount));
        }
        
        updateDisplay();
        
        if (remainingKana.length === 0 && currentRomaOptions.length === 0) {
            isAnimating = true;
            document.getElementById("utsuro-img").src = "utsuro_clear.png";
            
            /* 正解時のPNG表示時間：600ミリ秒（0.6秒） */
            setTimeout(() => {
                document.getElementById("utsuro-img").src = "utsuro_normal.png";
                isAnimating = false;
                nextWord();
            }, 600);
        }
    }
});

function endGame() {
    clearInterval(timerInterval);
    isPlaying = false;
    bgm.pause();
    
    const finalTime = elapsedTime.toFixed(2);
    const modeName = currentMode === 'assist' ? "アシストあり" : "アシストなし";
    const storageKey = currentMode === 'assist' ? "utsuro_typing_genma_best_assist" : "utsuro_typing_genma_best_noassist";
    const pastBest = bestTimes[currentMode];

    document.getElementById("start-screen").style.display = "block";
    document.getElementById("game-screen").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    
    document.getElementById("final-score-text").innerText = `クリアタイム（${modeName}）: ${finalTime} 秒`;
    
    if (pastBest === null || parseFloat(finalTime) < pastBest) {
        bestTimes[currentMode] = parseFloat(finalTime);
        localStorage.setItem(storageKey, bestTimes[currentMode]);
        document.getElementById("new-record-text").style.display = "block";
    } else {
        document.getElementById("new-record-text").style.display = "none";
    }
    
    loadAllHighScores();
    
    setTimeout(() => {
        alert(`10問クリア！タイムは ${finalTime} 秒でした！`);
    }, 100);
}

function shareOnX() {
    const finalTime = elapsedTime.toFixed(2);
    const modeName = currentMode === 'assist' ? "アシストあり" : "アシストなし";
    const gameUrl = window.location.href;
    
    const text = `氷室うつろタイピングゲーム（幻魔文字・${modeName}）をクリア！\nタイム: 【 ${finalTime} 秒 】\n幻魔文字の解読速度に挑戦しよう！\n`;
    const hashtags = "氷室うつろ,幻魔文字,鬼武者";
    
    const shareUrl = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(gameUrl)}&hashtags=${encodeURIComponent(hashtags)}`;
    
    window.open(shareUrl, '_blank', 'width=600,height=400');
}
</script>
